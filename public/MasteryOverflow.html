<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Mastery Overflow</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/css/base.css" />
        <link rel="stylesheet" href="/css/MOstyles.css" />
        <script src="/js/MasteryOverflow.js" defer></script>
    </head>
    <body>
        <h1>Search Riot ID</h1>
        <form id="collect-riot-id">
            <label for="username-input">Riot ID: </label>
            <input
                type="text"
                id="username-input"
                name="username"
                placeholder="Username"
            />

            <label for="tag-input">#</label>
            <input type="text" id="tag-input" name="tag" placeholder="Tag" />

            <input type="submit" value="Submit" />
        </form>

        <h1>Profile</h1>
        <p>
            Riot ID: <span id="display-username"></span
            ><span id="display-tag"></span>
        </p>

        <h1>Champion Mastery</h1>
        <table id="mastery-table">
            <thead>
                <tr>
                    <th>Champion</th>
                    <th>Level</th>
                    <th>Points</th>
                    <th>Marks</th>
                    <th>Min Grade for Next Mark</th>
                    <th>Limiting Factor</th>
                </tr>
            </thead>
            <tbody id="mastery-info">
                <tr>
                    <td colspan="8">Enter your Riot ID.</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
