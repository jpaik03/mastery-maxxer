<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Home</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/css/styles.css" />
        <script src="/js/script.js" defer></script>
    </head>
    <body>
        <h1>Search Riot ID</h1>
        <form id="collect-riot-id">
            <label for="username">Riot ID: </label>
            <input type="text" id="username-input" name="username" required />

            <label for="tag">#</label>
            <input type="text" id="tag-input" name="tag" required />

            <input type="submit" value="Submit" />
        </form>

        <h1>Profile</h1>
        <p>
            Riot ID: <span id="display-username">Name</span
            ><span id="display-tag">#NA1</span>
        </p>
        <p>PUUID: <span id="display-puuid">Your PUUID</span></p>

        <h1>Champion Mastery</h1>
        <div id="mastery-info">Enter your Riot ID.</div>
    </body>
</html>
